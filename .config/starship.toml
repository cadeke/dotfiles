"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
${custom.ocp}\
${custom.k8s}\
$terraform\
$git_branch\
$git_state\
$git_status\
$character\
"""

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = ""

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

# Active cluster, hidden when logged out (see .config/starship/kube.sh).
# `oc login` writes to the same kubeconfig kubectl uses, so both are covered.
# No OpenShift glyph exists in Nerd Fonts, so OCP gets the Red Hat logo.
[custom.ocp]
command = "$HOME/.config/starship/kube.sh ocp"
when = "$HOME/.config/starship/kube.sh ocp"
format = "[\U000f111b $output]($style) "
style = "bold red"

[custom.k8s]
command = "$HOME/.config/starship/kube.sh k8s"
when = "$HOME/.config/starship/kube.sh k8s"
format = "[\U000f10fe $output]($style) "
style = "bold blue"
